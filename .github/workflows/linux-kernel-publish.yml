# Lives in v9fs/test only (#15). Do not add a copy to v9fs/linux.
#
# Triggers: workflow_dispatch here, or `gh workflow run` from
# sync-torvalds-linux.yml. repository_dispatch (publish-kernel-image) is
# emergency/manual only — linux is mirror-only and must not fire it.
name: Publish Linux kernel (arm64 Image)

on:
  repository_dispatch:
    types: [publish-kernel-image]
  workflow_dispatch:
    inputs:
      linux_repository:
        description: 'Kernel GitHub repository (owner/name)'
        required: true
        default: 'v9fs/linux'
        type: string
      linux_ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: true
        default: 'main'
        type: string
      release_tag:
        description: 'Release tag to publish/update (kernel-main, kernel-latest, kernel-<version>)'
        required: true
        default: 'kernel-main'
        type: string
      also_latest:
        description: 'Also clobber the floating kernel-latest release with the same Image'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    env:
      V9FS_DOCKER_IMAGE: ghcr.io/v9fs/docker:latest
    steps:
      - name: Checkout harness (scripts)
        uses: actions/checkout@v4

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.linux_repository || github.event.client_payload.linux_repository || 'v9fs/linux' }}
          ref: ${{ inputs.linux_ref || github.event.client_payload.linux_ref || 'main' }}
          path: linux

      - name: Build kernel (arm64 Image)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp" "$GITHUB_WORKSPACE/kernel"
          docker run --rm --privileged \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/linux:/workspaces/linux" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            "${V9FS_DOCKER_IMAGE}" \
            bash -lc '\
              set -euo pipefail; \
              out=/workspaces/linux/.build; \
              mkdir -p "$out"; \
              if [ ! -f "$out/.config" ]; then \
                make -C /workspaces/linux O="$out" defconfig; \
              fi; \
              cfg=/workspaces/linux/scripts/config; \
              if [ -x "$cfg" ]; then \
                "$cfg" --file "$out/.config" \
                  -e NET_9P -e NET_9P_FD -e NET_9P_VIRTIO -e 9P_FS \
                  -e 9P_FS_POSIX_ACL -e 9P_FS_SECURITY -e 9P_FS_XATTR \
                  -e FS_POSIX_ACL -e TMPFS_POSIX_ACL \
                  -e UNIX -e VIRTIO_PCI -e PCI; \
                make -C /workspaces/linux O="$out" olddefconfig; \
              else \
                echo \"WARNING: missing scripts/config; relying on defconfig\"; \
              fi; \
              make -C /workspaces/linux O="$out" Image -j"$(nproc)"; \
              mkdir -p /workspaces/kernel/.build/arch/arm64/boot; \
              cp -f "$out/arch/arm64/boot/Image" /workspaces/kernel/.build/arch/arm64/boot/Image; \
            '

      - name: Publish Image as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || 'kernel-main' }}
          ALSO_LATEST: ${{ inputs.also_latest || github.event.client_payload.also_latest || false }}
          LINUX_REF: ${{ inputs.linux_ref || github.event.client_payload.linux_ref || 'main' }}
        run: |
          set -euo pipefail
          img="kernel/.build/arch/arm64/boot/Image"
          test -f "$img"
          cp -f "$img" Image

          publish_one() {
            local tag="$1"
            local notes="$2"
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --title "$tag" --notes "$notes" --prerelease
            gh release upload "$tag" Image --clobber
            echo "Published Image -> release $tag"
          }

          publish_one "$TAG" "Automated arm64 kernel Image from ${LINUX_REF}."

          # Floating alias for harness default / wiki “current tip” comparisons.
          if [ "${ALSO_LATEST}" = "true" ]; then
            publish_one "kernel-latest" "Floating latest Image (currently ${LINUX_REF} / ${TAG})."
          fi

