name: Harness CI

# After linux-kernel-publish.yml completes, workflow_run resolve parses that
# run's display title (run-name: "Publish <release_tag> from <linux_ref>").

on:
  push:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: "Release tag that provides arm64 Image (default: kernel-latest)"
        required: true
        default: "kernel-latest"
        type: string
      linux_ref:
        description: "Optional linux git ref label for reports (e.g. v7.2)"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["Publish Linux kernel (arm64 Image)"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: harness-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      kernel_release: ${{ steps.out.outputs.kernel_release }}
      linux_ref: ${{ steps.out.outputs.linux_ref }}
      should_run: ${{ steps.out.outputs.should_run }}
    steps:
      - name: Resolve kernel release
        id: out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            kr="${{ inputs.kernel_release }}"
            lr="${{ inputs.linux_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Contract with linux-kernel-publish.yml run-name:
            #   Publish <release_tag> from <linux_ref>
            pub_id="${{ github.event.workflow_run.id }}"
            title="$(gh run view "$pub_id" --repo "${{ github.repository }}" --json displayTitle --jq .displayTitle || true)"
            echo "triggering publish: $title"
            kr=""
            lr=""
            if [[ "${title}" =~ ^Publish[[:space:]]+([^[:space:]]+)[[:space:]]+from[[:space:]]+(.+)$ ]]; then
              kr="${BASH_REMATCH[1]}"
              lr="${BASH_REMATCH[2]}"
            fi
            if [ -z "${kr}" ]; then
              kr="kernel-latest"
              lr=""
            fi
          else
            # push: exercise harness against current tip Image when present.
            kr="kernel-latest"
            lr=""
          fi

          should_run=true
          if ! gh release view "$kr" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $kr not found yet"
            if [ "${{ github.event_name }}" = "push" ]; then
              should_run=false
            else
              echo "::error::Required release $kr is missing"
              exit 1
            fi
          fi

          # Derive linux_ref from release notes / tag name when possible.
          if [ -z "${lr}" ] && [ "$kr" != "kernel-latest" ] && [[ "$kr" == kernel-v* ]]; then
            lr="${kr#kernel-}"
          fi
          if [ -z "${lr}" ] && [ "$kr" = "kernel-latest" ]; then
            notes="$(gh release view kernel-latest --repo "${{ github.repository }}" --json body --jq .body || true)"
            # Notes look like: Floating latest Image (currently v7.2 / kernel-v7.2).
            lr="$(printf '%s\n' "$notes" | sed -n 's/.*currently \([^ /]*\).*/\1/p' | head -1 || true)"
          fi

          {
            echo "kernel_release=${kr}"
            echo "linux_ref=${lr}"
            echo "should_run=${should_run}"
          } >> "$GITHUB_OUTPUT"
          echo "kernel_release=${kr} linux_ref=${lr} should_run=${should_run}"

  tests:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        test:
          - smoke
          - fsx
          - postmark
          - dbench
          - diod-regression
          - qemu-9p2000.L
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KERNEL_RELEASE: ${{ needs.resolve.outputs.kernel_release }}
      V9FS_DOCKER_IMAGE: ghcr.io/v9fs/docker:latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v7

      - name: Ensure GitHub CLI present (for release download)
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh
          gh --version

      - name: Download published kernel Image
        run: |
          set -euo pipefail
          mkdir -p kernel/.build/arch/arm64/boot
          gh release download "${KERNEL_RELEASE}" -p Image -D kernel/.build/arch/arm64/boot --clobber
          ls -la kernel/.build/arch/arm64/boot/Image

      - name: Run ${{ matrix.test }} (guest-direct, chroot)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
                    --name "v9fs-test.${{ matrix.test }}.${{ github.run_id }}.${{ github.run_attempt }}" \
                    --label v9fs.harness=v9fs-test \
            --user 0:0 \
            -e KERNELBUILD=/workspaces/kernel/.build \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            "${V9FS_DOCKER_IMAGE}" \
            bash -lc "./scripts/v9fs-run-tests '${{ matrix.test }}'"

      - name: Dump logs on failure
        if: failure()
        run: |
          set -euo pipefail
          echo "==== logs tree ===="
          (ls -R logs || true)
          echo "==== qemu.log (tail) ===="
          for f in logs/*/qemu.log; do
            echo "---- $f ----"
            tail -n 250 "$f" || true
          done
          echo "==== guest.log (tail) ===="
          for f in logs/*/guest.log; do
            echo "---- $f ----"
            tail -n 250 "$f" || true
          done

      - name: Fix log permissions (for artifact upload)
        if: always()
        run: |
          sudo chmod -R a+rX logs || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test }}-logs
          path: logs
          retention-days: 7

  report:
    needs: [resolve, tests]
    if: always() && needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout harness
        uses: actions/checkout@v7

      - name: Ensure GitHub CLI
        run: |
          set -euo pipefail
          command -v gh >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gh
          }

      - name: Build results.json, diff, wiki dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_TOKEN: ${{ secrets.V9FS_LINUX_SYNC_TOKEN }}
          KERNEL_RELEASE: ${{ needs.resolve.outputs.kernel_release }}
          LINUX_REF: ${{ needs.resolve.outputs.linux_ref }}
          OUTDIR: report-out
        run: |
          set -euo pipefail
          mkdir -p report-out
          ./scripts/v9fs-ci-report
          ls -la report-out

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tip-regression-report
          path: report-out
          retention-days: 30

      - name: Attach results.json to the tested release (best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.V9FS_LINUX_SYNC_TOKEN }}
          KERNEL_RELEASE: ${{ needs.resolve.outputs.kernel_release }}
        run: |
          set -euo pipefail
          if [ ! -f report-out/results.json ]; then
            echo "no results.json"
            exit 0
          fi
          if [ -z "${GH_TOKEN}" ]; then
            echo "V9FS_LINUX_SYNC_TOKEN unset; skip release attach"
            exit 0
          fi
          gh release view "$KERNEL_RELEASE" >/dev/null 2>&1 || {
            echo "release ${KERNEL_RELEASE} missing; skip attach"
            exit 0
          }
          gh release upload "$KERNEL_RELEASE" report-out/results.json report-out/diff-report.md --clobber || true
          # Keep kernel-latest tip history when this run tested a kernel-v* Image.
          if [ "$KERNEL_RELEASE" != "kernel-latest" ] && [[ "$KERNEL_RELEASE" == kernel-v* ]]; then
            gh release view kernel-latest >/dev/null 2>&1 || exit 0
            gh release upload kernel-latest report-out/results.json report-out/diff-report.md --clobber || true
          fi
