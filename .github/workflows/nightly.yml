name: Mainline

permissions:
  contents: write
  packages: write

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight
  workflow_dispatch:
jobs:
  build-kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Checkout kernel under test
        uses: actions/checkout@v4
        with:
          repository: 'v9fs/linux'
          ref: 'main'
          path: linux

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Build kernel (QEMU guest kernel image)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp" "$GITHUB_WORKSPACE/kernel"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/linux:/workspaces/linux" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-build-kernel && v9fs-export-kernel /workspaces/linux /workspaces/linux/.build /workspaces/kernel"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/.build/arch/*/boot/*Image
            kernel/.build/arch/*/boot/bzImage
          retention-days: 7

      - name: Publish arm64 Image as release asset (kernel-nightly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: kernel-nightly
          TITLE: kernel-nightly
        run: |
          set -euo pipefail
          img="kernel/.build/arch/arm64/boot/Image"
          if [ ! -f "$img" ]; then
            echo "ERROR: missing $img"
            find kernel/.build -maxdepth 6 -type f | sed 's|^|  |'
            exit 2
          fi

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TITLE" --notes "Automated arm64 kernel Image from nightly (${GITHUB_SHA})." --prerelease
          cp -f "$img" Image
          gh release upload "$TAG" Image --clobber

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Package kernel image(s) for GHCR
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t files < <(
            find kernel/.build/arch -type f \( -name '*Image' -o -name 'bzImage' \) -print | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no kernel images found under kernel/.build/arch"
            find kernel -maxdepth 5 -type f | sed 's|^|  |'
            exit 2
          fi
          tar -czf "dist/kernel-image-${GITHUB_SHA}.tar.gz" "${files[@]}"

      - name: Publish kernel image package to GHCR (OCI artifact)
        env:
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/v9fs-test-kernel
          ORAS_EXPERIMENTAL_OCI_ARTIFACT: "1"
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          oras push "${GHCR_REPO}:${GITHUB_SHA}" \
            "dist/kernel-image-${GITHUB_SHA}.tar.gz:application/gzip"
          oras tag "${GHCR_REPO}:${GITHUB_SHA}" "nightly"
          oras tag "${GHCR_REPO}:${GITHUB_SHA}" "main"

  test:
    needs: build-kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: kernel/.build/arch

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Run regression tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -e KERNELBUILD=/workspaces/kernel/.build \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-run-tests regress ci"

      - name: Fix log permissions (for artifact upload)
        if: always()
        run: |
          sudo chmod -R a+rX logs || true

      - name: Store Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-regression
          path: logs
          retention-days: 7

  latency:
    needs: build-kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: kernel/.build/arch

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Run latency tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -e KERNELBUILD=/workspaces/kernel/.build \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-run-tests short latency && echo Nightly v9fs/linux main > /home/v9fs-test/test/logs/tag.txt"

      - name: Fix log permissions (for artifact upload)
        if: always()
        run: |
          sudo chmod -R a+rX logs || true

      - name: Store Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-latency
          path: logs
          retention-days: 7

