name: Mainline

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight
  workflow_dispatch:
    inputs:
      kernel_release:
        description: 'GitHub release tag that provides the arm64 `Image` asset (default: kernel-nightly)'
        required: true
        default: 'kernel-nightly'
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KERNEL_RELEASE: ${{ inputs.kernel_release || 'kernel-nightly' }}
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Download published kernel Image
        run: |
          set -euo pipefail
          mkdir -p kernel/.build/arch/arm64/boot
          gh release download "${KERNEL_RELEASE}" -p Image -D kernel/.build/arch/arm64/boot --clobber
          ls -la kernel/.build/arch/arm64/boot/Image

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Run regression tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -e KERNELBUILD=/workspaces/kernel/.build \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-run-tests regress ci"

      - name: Dump logs on failure
        if: failure()
        run: |
          set -euo pipefail
          echo "==== logs tree ===="
          (ls -R logs || true)
          echo "==== qemu.log (tail) ===="
          for f in logs/*/qemu.log; do
            echo "---- $f ----"
            tail -n 250 "$f" || true
          done
          echo "==== per-test logs (tail) ===="
          for f in logs/*/*/*/*.log; do
            echo "---- $f ----"
            tail -n 80 "$f" || true
          done
          echo "==== guest exitcode markers ===="
          for f in logs/*/guest.exitcode; do
            echo "---- $f ----"
            cat "$f" || true
          done

      - name: Fix log permissions (for artifact upload)
        if: always()
        run: |
          sudo chmod -R a+rX logs || true

      - name: Store Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-regression
          path: logs
          retention-days: 7

  latency:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KERNEL_RELEASE: ${{ inputs.kernel_release || 'kernel-nightly' }}
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Download published kernel Image
        run: |
          set -euo pipefail
          mkdir -p kernel/.build/arch/arm64/boot
          gh release download "${KERNEL_RELEASE}" -p Image -D kernel/.build/arch/arm64/boot --clobber
          ls -la kernel/.build/arch/arm64/boot/Image

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Run latency tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -e KERNELBUILD=/workspaces/kernel/.build \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-run-tests short latency && echo \"Nightly ${KERNEL_RELEASE} v9fs/linux\" > /home/v9fs-test/test/logs/tag.txt"

      - name: Dump logs on failure
        if: failure()
        run: |
          set -euo pipefail
          echo "==== logs tree ===="
          (ls -R logs || true)
          echo "==== qemu.log (tail) ===="
          for f in logs/*/qemu.log; do
            echo "---- $f ----"
            tail -n 250 "$f" || true
          done
          echo "==== per-test logs (tail) ===="
          for f in logs/*/*/*/*.log; do
            echo "---- $f ----"
            tail -n 80 "$f" || true
          done
          echo "==== guest exitcode markers ===="
          for f in logs/*/guest.exitcode; do
            echo "---- $f ----"
            cat "$f" || true
          done

      - name: Fix log permissions (for artifact upload)
        if: always()
        run: |
          sudo chmod -R a+rX logs || true

      - name: Store Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-latency
          path: logs
          retention-days: 7
