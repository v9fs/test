name: Mainline

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Checkout kernel under test
        uses: actions/checkout@v4
        with:
          repository: 'v9fs/linux'
          ref: 'master'
          path: linux

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Build kernel + run regression tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/linux:/workspaces/linux" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-build-kernel && v9fs-run-tests regress ci"

      - name: Build kernel + run latency tests (QEMU)
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/linux:/workspaces/linux" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-build-kernel && v9fs-run-tests short latency && echo Nightly v9fs/linux master > /home/v9fs-test/test/logs/tag.txt"

      - name: Store Logs
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: logs
          retention-days: 7

