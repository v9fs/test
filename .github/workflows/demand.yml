name: On Demand Regression

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'repository path'
        required: true
        default: 'v9fs/linux'
        type: string
      ref:
        description: 'repository reference'
        required: true
        default: 'ericvh/for-next'
        type: string
      resultstag:
        description: 'how to tag results'
        default: 'ci'
        type: string
  workflow_call:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Checkout kernel under test
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: linux

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Build kernel + run CI tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/linux:/workspaces/linux" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-build-kernel && v9fs-run-tests short ci"

      - name: Build kernel + run latency tests (QEMU)
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/linux:/workspaces/linux" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-build-kernel && v9fs-run-tests short latency && echo ${{ inputs.resultstag }} ${{ inputs.repo }} ${{ inputs.ref }} > /home/v9fs-test/test/logs/tag.txt"

      - name: Store Logs
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: logs
          retention-days: 7

