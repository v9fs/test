name: CI (push and manual)

permissions:
  contents: read
  packages: write

on:
  # Run CI on every push (all branches). Narrow with `branches:` if this is too noisy.
  push:
  workflow_dispatch:
    inputs:
      repo:
        description: 'repository path'
        required: true
        default: 'v9fs/linux'
        type: string
      ref:
        description: 'repository reference'
        required: true
        default: 'main'
        type: string
      resultstag:
        description: 'how to tag results'
        default: 'ci'
        type: string
  workflow_call:
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch / workflow_call populate `inputs`; push does not — use defaults.
      KERNEL_REPO: ${{ inputs.repo || 'v9fs/linux' }}
      # Pin to main for stable CI (avoid volatile topic branches).
      KERNEL_REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Checkout kernel under test
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          path: linux

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Build kernel (QEMU guest kernel image)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp" "$GITHUB_WORKSPACE/kernel"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/linux:/workspaces/linux" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-build-kernel && v9fs-export-kernel /workspaces/linux /workspaces/linux/.build /workspaces/kernel"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/.build/arch/*/boot/*Image
            kernel/.build/arch/*/boot/bzImage
          retention-days: 7

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Package kernel image(s) for GHCR
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t files < <(
            find kernel/.build/arch -type f \( -name '*Image' -o -name 'bzImage' \) -print | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no kernel images found under kernel/.build/arch"
            find kernel -maxdepth 5 -type f | sed 's|^|  |'
            exit 2
          fi
          tar -czf "dist/kernel-image-${GITHUB_SHA}.tar.gz" "${files[@]}"

      - name: Publish kernel image package to GHCR (OCI artifact)
        env:
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/v9fs-test-kernel
          ORAS_EXPERIMENTAL_OCI_ARTIFACT: "1"
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Publish a content-addressed artifact tagged by commit SHA, plus a ref tag for convenience.
          oras push "${GHCR_REPO}:${GITHUB_SHA}" \
            "dist/kernel-image-${GITHUB_SHA}.tar.gz:application/gzip"
          oras tag "${GHCR_REPO}:${GITHUB_SHA}" "${KERNEL_REF}"

  test:
    needs: build-kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: kernel/.build/arch

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Run CI tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -e KERNELBUILD=/workspaces/kernel/.build \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-run-tests short ci"

      - name: Fix log permissions (for artifact upload)
        if: always()
        run: |
          sudo chmod -R a+rX logs || true

      - name: Store Logs
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ci
          path: logs
          retention-days: 7

  latency:
    needs: build-kernel
    runs-on: ubuntu-latest
    env:
      RESULTSTAG: ${{ inputs.resultstag || github.sha }}
      KERNEL_REPO: ${{ inputs.repo || 'v9fs/linux' }}
      # Pin to main for stable CI (avoid volatile topic branches).
      KERNEL_REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: kernel/.build/arch

      - name: Build Docker environment
        run: docker build -t v9fs-test-env:local .

      - name: Run latency tests (QEMU)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          docker run --rm --privileged \
            -e KERNELBUILD=/workspaces/kernel/.build \
            -v "$GITHUB_WORKSPACE:/home/v9fs-test/test" \
            -v "$GITHUB_WORKSPACE/kernel:/workspaces/kernel" \
            -v "$GITHUB_WORKSPACE/tmp:/workspaces/tmp" \
            -w /home/v9fs-test/test \
            v9fs-test-env:local \
            bash -lc "v9fs-run-tests short latency && echo \"$RESULTSTAG $KERNEL_REPO $KERNEL_REF\" > /home/v9fs-test/test/logs/tag.txt"

      - name: Fix log permissions (for artifact upload)
        if: always()
        run: |
          sudo chmod -R a+rX logs || true

      - name: Store Logs
        uses: actions/upload-artifact@v4
        with:
          name: test-results-latency
          path: logs
          retention-days: 7

